<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PumpApp - Accesso</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #18181a;
            --card-bg: #222225;
            --neon-green: #c1ff00;
            --text-light: #ffffff;
            --text-gray: #888888;
            --input-bg: #141415;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Evita lo scroll se non necessario */
            background-image: repeating-linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.02) 0px,
                rgba(255, 255, 255, 0.02) 2px,
                transparent 2px,
                transparent 4px
            ); /* Semplice texture di sfondo */
        }

        /* Top Navigation Bar */
        .top-nav {
            padding: 20px 40px;
            font-size: 0.9rem;
            color: var(--text-gray);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .top-nav i {
            cursor: pointer;
        }

        /* Main Layout */
        .container {
            display: flex;
            flex: 1;
            padding: 0 40px;
        }

        /* Left Panel - Immagine e Testo */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 60px;
            position: relative;
            /* Sostituisci l'URL qui sotto con la tua immagine al neon */
            background: url('sfondo-atleta.png') no-repeat center center; 
            background-size: contain;
        }

        .hero-text h1 {
            font-size: 2.5rem;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: 1px;
        }

        /* Right Panel - Login Card */
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Logo and Header */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .logo-container h2 {
            color: var(--neon-green);
            font-size: 2.2rem;
            font-weight: 700;
        }

        .logo-container i {
            color: var(--neon-green);
            font-size: 1.8rem;
        }

        .login-card h3 {
            text-align: center;
            color: var(--text-gray);
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--text-gray);
            margin-bottom: 8px;
            font-size: 0.9rem;
            padding-left: 5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid rgba(193, 255, 0, 0.3); /* Bordo neon leggero */
            border-radius: 8px;
            padding: 0 15px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(193, 255, 0, 0.05);
        }

        /* Effetto bagliore (Glow) al passaggio del mouse o al focus */
        .input-wrapper:hover, .input-wrapper:focus-within {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(193, 255, 0, 0.2);
        }

        .input-wrapper i {
            color: var(--text-gray);
            margin-right: 10px;
        }

        .input-wrapper input {
            background: transparent;
            border: none;
            color: var(--text-light);
            padding: 15px 0;
            width: 100%;
            font-size: 1rem;
            outline: none;
        }

        /* Links and Buttons */
        .forgot-pwd {
            display: block;
            text-align: center;
            color: #444; /* Colore molto scuro come nell'immagine */
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 30px;
            transition: color 0.3s;
        }
        
        .forgot-pwd:hover {
            color: var(--text-gray);
        }

        .btn-login {
            background-color: var(--neon-green);
            color: #000;
            border: none;
            border-radius: 25px;
            padding: 15px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-bottom: 20px;
        }

        .btn-login:hover {
            background-color: #aae000;
        }
        
        .btn-login:active {
            transform: scale(0.98);
        }

        .register-link {
            text-align: center;
            color: #444;
            font-size: 0.85rem;
        }

        .register-link a {
            color: #444;
            text-decoration: none;
            transition: color 0.3s;
        }

        .register-link a:hover {
            color: var(--text-gray);
        }

        /* Responsive Design per dispositivi mobili */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                padding: 20px;
            }
            .left-panel {
                flex: 0.5;
                padding-bottom: 20px;
                background-position: center bottom;
                min-height: 300px;
            }
            .hero-text h1 {
                font-size: 1.8rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header class="top-nav">
        <i class="fas fa-arrow-left"></i> 
        <span>PumpApp | Accesso</span>
    </header>

    <main class="container">
        <section class="left-panel">
            <div class="hero-text">
                <h1>IL TUO VIAGGIO<br>INIZIA QUI</h1>
            </div>
        </section>

        <section class="right-panel">
            <div class="login-card">
                <div class="logo-container">
                    <h2>PumpApp</h2>
                    <i class="fas fa-dumbbell"></i>
                </div>
                <h3>ACCEDI AL TUO ACCOUNT</h3>

                <form action="#" method="POST">
                    <div class="form-group">
                        <label>Indirizzo Email</label>
                        <div class="input-wrapper">
                            <i class="far fa-envelope"></i>
                            <input type="email" placeholder="" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" placeholder="" required>
                        </div>
                    </div>

                    <a href="#" class="forgot-pwd">Password dimenticata?</a>

                    <button type="submit" class="btn-login">ACCEDI</button>

                    <p class="register-link">Non hai un account? <a href="#">Registrati qui</a></p>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
