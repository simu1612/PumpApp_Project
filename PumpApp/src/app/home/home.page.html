<ion-page>
  <ion-header class="ion-no-border">
    <ion-toolbar color="primary">
      <ion-title>🏋️ PumpApp</ion-title>
      <ion-buttons slot="end">
        <ion-button routerLink="/profile">
          <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    
    <ion-card>
      <ion-card-header>
        <ion-card-title>📅 Le tue Prestazioni</ion-card-title>
        <ion-card-subtitle>Monitora la tua costanza</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-grid>
          <ion-row class="ion-text-center">
            <ion-col>
              <ion-label>Lun</ion-label><br>
              <ion-icon name="ellipse" color="success" size="small"></ion-icon>
            </ion-col>
            <ion-col>
              <ion-label>Mar</ion-label><br>
              <ion-icon name="ellipse" color="danger" size="small"></ion-icon>
            </ion-col>
            <ion-col>
              <ion-label>Mer</ion-label><br>
              <ion-icon name="ellipse" color="medium" size="small"></ion-icon>
            </ion-col>
            <ion-col>
              <ion-label>Gio</ion-label><br>
              <ion-icon name="ellipse" color="success" size="small"></ion-icon>
            </ion-col>
            <ion-col>
              <ion-label>Ven</ion-label><br>
            </ion-col>
            <ion-col>
              <ion-label>Sab</ion-label><br>
            </ion-col>
            <ion-col>
              <ion-label>Dom</ion-label><br>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-header>
        <ion-card-subtitle color="primary">🔥 Workout di Oggi</ion-card-subtitle>
        <ion-card-title>Giorno B - Dorso e Bicipiti</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-list lines="none">
          <ion-item>
            <ion-icon name="time-outline" slot="start"></ion-icon>
            <ion-label>Durata stimata: 60 min</ion-label>
          </ion-item>
          <ion-item>
            <ion-icon name="barbell-outline" slot="start"></ion-icon>
            <ion-label>Prossimo: Trazioni</ion-label>
          </ion-item>
        </ion-list>
        
        <ion-button expand="block" shape="round" class="ion-margin-top" routerLink="/sessione-attiva">
          Inizia Sessione
        </ion-button>
      </ion-card-content>
    </ion-card>

  </ion-content>

  <ion-tabs>
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="home" routerLink="/dashboard">
        <ion-icon name="home"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="workouts" routerLink="/my-workouts">
        <ion-icon name="barbell"></ion-icon>
        <ion-label>Workouts</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="progress" routerLink="/progress">
        <ion-icon name="trending-up"></ion-icon>
        <ion-label>Progress</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="pt" routerLink="/prenota-pt">
        <ion-icon name="calendar"></ion-icon>
        <ion-label>Staff</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-page>
