<ion-content [fullscreen]="true" class="login-content">
  <div class="login-wrapper">
    
    <header class="top-nav">
        <ion-icon name="arrow-back-outline"></ion-icon> 
        <span>PumpApp | Accesso</span>
    </header>

    <main class="container">
        <section class="left-panel">
            <div class="hero-text">
                <h1>IL TUO VIAGGIO<br>INIZIA QUI</h1>
            </div>
        </section>

        <section class="right-panel">
            <div class="login-card">
                <div class="logo-container">
                    <h2>PumpApp</h2>
                    <ion-icon name="barbell-outline"></ion-icon>
                </div>
                <h3>ACCEDI AL TUO ACCOUNT</h3>

                <form (ngSubmit)="onSubmit()">
                    <div class="form-group">
                        <label>Indirizzo Email</label>
                        <div class="input-wrapper">
                            <ion-icon name="mail-outline"></ion-icon>
                            <ion-input type="email" placeholder=""></ion-input>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <ion-icon name="lock-closed-outline"></ion-icon>
                            <ion-input type="password" placeholder=""></ion-input>
                        </div>
                    </div>

                    <a href="#" class="forgot-pwd">Password dimenticata?</a>

                    <ion-button expand="block" shape="round" type="submit" class="btn-login">
                        ACCEDI
                    </ion-button>

                    <p class="register-link">Non hai un account? <a href="#">Registrati qui</a></p>
                </form>
            </div>
        </section>
    </main>

  </div>
</ion-content>
